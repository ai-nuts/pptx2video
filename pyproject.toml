[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx2video"
version = "0.5.0"
description = "Deterministic, editable PowerPoint-to-video rendering with native animation timing and strict QA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pptx2video contributors" }]
dependencies = [
  "edge-tts>=7.0.0",
  "imageio-ffmpeg>=0.6.0",
  "lxml>=5.0.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "python-pptx>=1.0.0",
]

[project.optional-dependencies]
svg = ["playwright>=1.50.0"]
regenerate = ["openai>=1.0.0"]
dev = [
  "build>=1.2.0",
]

[project.scripts]
pptx2video = "pptx2video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
